  async function initApp() {
    shaka.polyfill.installAll();
    const video = document.getElementById('video');
    shakaPlayer = new shaka.Player(video);

    shakaPlayer.addEventListener('error', (event) => {
      console.error('Shaka Error Code:', event.detail.code, event.detail);
    });

    playSelectedChannel();
  }

  async function playSelectedChannel() {
    const key = document.getElementById('channelSelect').value;
    const item = channels[key];
    const video = document.getElementById('video');
    const infoBox = document.getElementById('channelInfo');

    infoBox.innerHTML = `<b>Status:</b> Memuatkan...<br><b>URL:</b> ${item.url}`;

    // Reset Pemain
    if (hlsPlayer) {
      hlsPlayer.destroy();
      hlsPlayer = null;
    }
    await shakaPlayer.unload();

    if (item.type === "dash") {
      // Configure DRM
      if (item.key) {
        shakaPlayer.configure({
          drm: { clearKeys: item.key }
        });
      }

      try {
        await shakaPlayer.load(item.url);
        infoBox.innerHTML = `<b>Status:</b> Berjaya Dimainkan (DASH)<br><b>KID/Key applied:</b> Yes`;
      } catch (e) {
        infoBox.innerHTML = `<span style="color: #ef4444;"><b>Ralat:</b> Tidak boleh diputar secara terus dari pelayar. Perlu lalu CacheProxy untuk melepas sekatan User-Agent/CORS!</span>`;
      }
    } else if (item.type === "hls") {
      if (Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(item.url);
        hlsPlayer.attachMedia(video);
        infoBox.innerHTML = `<b>Status:</b> Berjaya Dimainkan (HLS)`;
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = item.url;
        infoBox.innerHTML = `<b>Status:</b> Berjaya Dimainkan (HLS Native)`;
      }
    }
  }

  document.addEventListener('DOMContentLoaded', initApp);
