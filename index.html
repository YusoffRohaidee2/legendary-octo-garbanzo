<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNT Sports Player</title>

  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .player-container {
      width: 100%;
      max-width: 900px;
      background-color: #1e293b;
      padding: 20px;
      border-radius: 10px;
    }
    .video-js {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    select, button {
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    select {
      flex: 1;
      background-color: #334155;
      color: #fff;
    }
    button {
      background-color: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .info {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="player-container">
  <h2>TNT Sports Channels</h2>
  
  <video id="tnt-player" class="video-js vjs-default-skin" controls autoplay preload="auto"></video>

  <div class="controls">
    <select id="channelSelect">
      <option value="tnt1">TNT Sports 1</option>
      <option value="tnt2">TNT Sports 2</option>
      <option value="tnt3">TNT Sports 3</option>
      <option value="tnt4">TNT Sports 4</option>
    </select>
    <button onclick="playSelectedChannel()">Mainkan</button>
  </div>
  
  <div class="info" id="channelInfo"></div>
</div>

<!-- Scripts -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-shaka-player@1.0.0/dist/videojs-shaka-player.min.js"></script>

<script>
  const channels = {
    "tnt1": {
      name: "TNT Sports 1",
      url: "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/rhf2dwosdt/out/v1/ee550d2a68d846c797e6ce4de2e8b76d/cenc.mpd",
      key: { "69a5aa835a061ce64a630d1046727e40": "d02feac8a999bd06bf4059bf33411749" }
    },
    "tnt2": {
      name: "TNT Sports 2",
      url: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/puehlftk5j/out/v1/f7f0da1ee112481ca0024e6d4dd97f4a/cenc.mpd",
      key: { "f3df7843080ae743bf865dc5fdf64c68": "567c863bc12eb74788ea74888c042e1b" }
    },
    "tnt3": {
      name: "TNT Sports 3",
      url: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/dev1hjwzh9/out/v1/a5f0ee7ad7b24906b14f43bebbbe4678/cenc.mpd",
      key: { "cc91508324ce9dcaf425a43d58f1d9d4": "643e5474d9edd87c7d9091c8c97994ca" }
    },
    "tnt4": {
      name: "TNT Sports 4",
      url: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/tdijwiga2k/out/v1/f5fde318678f4f7583bf27b7231bde1f/cenc.mpd",
      key: { "fa34fa8c90336dd528c7a23871cad1fe": "552a78d1aeb74f1650d68255c5749408" }
    }
  };

  let player;

  document.addEventListener('DOMContentLoaded', () => {
    player = videojs('tnt-player', {
      techOrder: ['shaka', 'html5']
    });
    
    playSelectedChannel();
  });

  function playSelectedChannel() {
    const key = document.getElementById('channelSelect').value;
    const item = channels[key];
    const infoBox = document.getElementById('channelInfo');

    infoBox.innerHTML = `<b>Status:</b> Memuatkan ${item.name}...`;

    player.src({
      src: item.url,
      type: 'application/dash+xml',
      keySystems: {
        'org.w3.clearkey': {
          clearKeys: item.key
        }
      }
    });

    player.play();
    infoBox.innerHTML = `<b>Status:</b> Dimainkan<br><b>Saluran:</b> ${item.name}`;
  }
</script>

</body>
</html>
